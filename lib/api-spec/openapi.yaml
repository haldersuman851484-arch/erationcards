openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PVC Ration Card Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: PVC card order operations
  - name: operators
    description: Operator (printing partner) operations
  - name: auth
    description: Authentication operations
  - name: dashboard
    description: Admin/manager dashboard operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Orders ──────────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders (admin/manager)
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: operatorId
          schema:
            type: ["integer", "null"]
        - in: query
          name: search
          schema:
            type: string
          description: Search by order number, customer name, or phone
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new PVC card print order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/track:
    get:
      operationId: trackOrder
      tags: [orders]
      summary: Track order by order number or ration card number
      parameters:
        - in: query
          name: orderNumber
          schema:
            type: string
        - in: query
          name: rationCardNumber
          schema:
            type: string
      responses:
        "200":
          description: Order tracking info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/stats:
    get:
      operationId: getOrderStats
      tags: [orders]
      summary: Get order statistics summary
      responses:
        "200":
          description: Order stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStats"

  /orders/recent:
    get:
      operationId: listRecentOrders
      tags: [orders]
      summary: List recent orders (last 10)
      responses:
        "200":
          description: Recent orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/customer-info:
    patch:
      operationId: updateOrderCustomerInfo
      tags: [orders]
      summary: Correct an order's customer contact & delivery details (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInfoUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/payment-status:
    patch:
      operationId: updateOrderPaymentStatus
      tags: [orders]
      summary: Confirm or reject a payment (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentStatusUpdate"
      responses:
        "200":
          description: Payment status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusUpdateResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/assign:
    patch:
      operationId: assignOrderToOperator
      tags: [orders]
      summary: Assign order to an operator
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderAssignment"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{orderNumber}/submit:
    post:
      operationId: submitOrder
      tags: [orders]
      summary: Final submit of the order wizard — emails the order number to the customer
      parameters:
        - in: path
          name: orderNumber
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order submitted; email delivery attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSubmitResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Payments ─────────────────────────────────────────────────────────────────
  /payments/upload-screenshot:
    post:
      operationId: uploadPaymentScreenshot
      tags: [orders]
      summary: Upload a UPI payment screenshot
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [screenshot]
              properties:
                screenshot:
                  type: string
                  format: binary
      responses:
        "200":
          description: Screenshot uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentScreenshotUploadResponse"
        "400":
          description: No screenshot provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/upi-config:
    get:
      operationId: getUpiConfig
      tags: [orders]
      summary: Get merchant UPI ID for display and QR code generation
      responses:
        "200":
          description: UPI configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpiConfig"

  /pricing/config:
    get:
      operationId: getPricingConfig
      tags: [orders]
      summary: Get the live card price matrix used by order forms and receipts
      responses:
        "200":
          description: Current price matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingConfig"

  /admin/settings/pricing:
    get:
      operationId: getPricingSetting
      tags: [dashboard]
      summary: Get the card price matrix setting (admin)
      responses:
        "200":
          description: Current price matrix and whether it is admin-saved or the built-in default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingSetting"
        "401":
          description: Not authenticated
        "403":
          description: Settings locked — both partners' emailed codes must be verified first
    put:
      operationId: updatePricingSetting
      tags: [dashboard]
      summary: Update the card price matrix (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingSettingUpdate"
      responses:
        "200":
          description: Prices saved; order forms and server-side amounts use them immediately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingSetting"
        "400":
          description: Invalid prices (must be whole rupees between 1 and 10000)
        "401":
          description: Not authenticated
        "403":
          description: Settings locked — both partners' emailed codes must be verified first

  /admin/settings/upi:
    get:
      operationId: getUpiSetting
      tags: [dashboard]
      summary: Get the merchant UPI ID setting (admin)
      responses:
        "200":
          description: Current merchant UPI ID and whether it is admin-saved or the server default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpiSetting"
        "401":
          description: Not authenticated
        "403":
          description: Settings locked — both partners' emailed codes must be verified first
    put:
      operationId: updateUpiSetting
      tags: [dashboard]
      summary: Update the merchant UPI ID (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpiSettingUpdate"
      responses:
        "200":
          description: Setting saved; customers see the new UPI ID immediately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpiSetting"
        "400":
          description: Invalid UPI ID format
        "401":
          description: Not authenticated
        "403":
          description: Settings locked — both partners' emailed codes must be verified first

  /admin/settings/processing-password:
    put:
      operationId: updateProcessingPassword
      tags: [dashboard]
      summary: Change the employee (processing) login password (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessingPasswordUpdate"
      responses:
        "200":
          description: Password saved; processing login uses it immediately, no restart needed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingPasswordUpdateResponse"
        "400":
          description: Password too short or otherwise invalid
        "401":
          description: Not authenticated
        "403":
          description: Settings locked — both partners' emailed codes must be verified first

  /admin/settings/history:
    get:
      operationId: listSettingsChangeHistory
      tags: [dashboard]
      summary: Recent UPI ID and card price changes (admin, read-only)
      responses:
        "200":
          description: Most recent settings changes, newest first (max 20)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsChangeHistory"
        "401":
          description: Not authenticated
        "403":
          description: Settings locked — both partners' emailed codes must be verified first

  /admin/settings/otp/config:
    get:
      operationId: getSettingsOtpConfig
      tags: [dashboard]
      summary: Get the settings unlock gate status (admin)
      responses:
        "200":
          description: Partner emails plus pending-code and cooldown status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsOtpConfig"
        "401":
          description: Not authenticated

  /admin/settings/otp/send:
    post:
      operationId: sendSettingsOtp
      tags: [dashboard]
      summary: Email a one-time code to every partner (admin)
      responses:
        "200":
          description: Codes generated and emailed to every partner address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsOtpSendResponse"
        "401":
          description: Not authenticated
        "429":
          description: Resend requested during the cooldown window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: One or more code emails could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/settings/otp/verify:
    post:
      operationId: verifySettingsOtp
      tags: [dashboard]
      summary: Verify both partners' codes and unlock settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsOtpVerifyBody"
      responses:
        "200":
          description: All codes correct — returns a short-lived settings unlock token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsOtpVerifyResponse"
        "400":
          description: Wrong, expired, or missing codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated

  # ── Operators ────────────────────────────────────────────────────────────────
  /operators:
    get:
      operationId: listOperators
      tags: [operators]
      summary: List operators (staff only — processing role sees only active operators; non-active status filters require the admin role)
      responses:
        "200":
          description: List of operators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Operator"
    post:
      operationId: registerOperator
      tags: [operators]
      summary: Register as an operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorInput"
      responses:
        "201":
          description: Operator registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAuthResponse"

  /operators/login:
    post:
      operationId: loginOperator
      tags: [operators, auth]
      summary: Operator login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /operators/me:
    get:
      operationId: getCurrentOperator
      tags: [operators, auth]
      summary: Get currently logged-in operator
      responses:
        "200":
          description: Current operator profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /operators/logout:
    post:
      operationId: logoutOperator
      tags: [operators, auth]
      summary: Logout operator
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /operators/me/orders:
    get:
      operationId: getOperatorOrders
      tags: [operators]
      summary: Get orders assigned to current operator
      parameters:
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: Operator's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /operators/me/stats:
    get:
      operationId: getOperatorStats
      tags: [operators]
      summary: Get stats for current operator
      responses:
        "200":
          description: Operator stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorStats"

  # ── Admin Operator Management ─────────────────────────────────────────────────
  /admin/operators/{id}/status:
    patch:
      operationId: updateOperatorStatus
      tags: [dashboard]
      summary: Approve or suspend an operator (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOperatorStatusInput"
      responses:
        "200":
          description: Operator status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorStatusResponse"

  # ── Admin ─────────────────────────────────────────────────────────────────────
  /admin/verifications:
    get:
      operationId: listPaymentVerifications
      tags: [dashboard]
      summary: List payment verification history (admin)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Payment verification records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentVerificationListResponse"

  # ── Reviews ──────────────────────────────────────────────────────────────────
  /reviews:
    get:
      operationId: listApprovedReviews
      tags: [orders]
      summary: List approved customer reviews (public)
      responses:
        "200":
          description: Approved reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: submitReview
      tags: [orders]
      summary: Submit a customer review after receiving a card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review submitted, pending admin approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found or not eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/reviews:
    get:
      operationId: listAdminReviews
      tags: [dashboard]
      summary: List all reviews for moderation (admin)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: All reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  /admin/reviews/{id}:
    patch:
      operationId: updateReviewStatus
      tags: [dashboard]
      summary: Approve or reject a review (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewStatusUpdate"
      responses:
        "200":
          description: Review status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteReview
      tags: [dashboard]
      summary: Permanently delete a review (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Review permanently deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Admin Auth ───────────────────────────────────────────────────────────────
  /admin/login:
    post:
      operationId: loginAdmin
      tags: [auth]
      summary: Staff login (admin or processing role, decided by password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/me:
    get:
      operationId: getCurrentAdmin
      tags: [auth]
      summary: Get currently logged-in staff session (admin or processing)
      responses:
        "200":
          description: Admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"

  /admin/logout:
    post:
      operationId: logoutAdmin
      tags: [auth]
      summary: Logout admin
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    OrderSubmitResponse:
      type: object
      properties:
        success:
          type: boolean
        emailSent:
          type: boolean
      required:
        - success
        - emailSent

    # ── Order Schemas ──────────────────────────────────────────────────────────
    Order:
      type: object
      properties:
        id:
          type: integer
        orderNumber:
          type: string
        customerName:
          type: string
        customerPhone:
          type: string
        customerEmail:
          type: ["string", "null"]
        rationCardNumber:
          type: string
        deliveryName:
          type: ["string", "null"]
        address:
          type: string
        postOffice:
          type: ["string", "null"]
        state:
          type: string
        district:
          type: string
        pincode:
          type: string
        cardType:
          type: string
        familyCards:
          type: array
          items:
            type: object
            properties:
              customerName:
                type: string
              rationCardNumber:
                type: string
              cardType:
                type: string
            required:
              - customerName
              - rationCardNumber
              - cardType
        quantity:
          type: integer
        amount:
          type: number
        paymentStatus:
          type: string
        paymentMethod:
          type: ["string", "null"]
        paymentScreenshotUrl:
          type: ["string", "null"]
        status:
          type: string
        operatorId:
          type: ["integer", "null"]
        operatorName:
          type: ["string", "null"]
        trackingNumber:
          type: ["string", "null"]
        courierName:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        otherOrders:
          description: >-
            Present only on GET /orders/track when the searched ration card
            number has more than one order. Summaries (newest first) of every
            order under that card, so a caller can offer a pick list instead of
            silently hiding older orders.
          type: array
          items:
            type: object
            properties:
              orderNumber:
                type: string
              status:
                type: string
              cardType:
                type: string
              quantity:
                type: integer
              createdAt:
                type: string
            required:
              - orderNumber
              - status
              - createdAt
      required:
        - id
        - orderNumber
        - customerName
        - customerPhone
        - rationCardNumber
        - address
        - state
        - district
        - pincode
        - cardType
        - quantity
        - amount
        - paymentStatus
        - status
        - createdAt
        - updatedAt

    OrderInput:
      type: object
      properties:
        customerName:
          type: string
        customerPhone:
          type: string
        customerEmail:
          type: string
        rationCardNumber:
          type: string
        deliveryName:
          type: string
        address:
          type: string
        postOffice:
          type: string
        state:
          type: string
        district:
          type: string
        pincode:
          type: string
        cardType:
          type: string
        familyCards:
          type: array
          items:
            type: object
            properties:
              customerName:
                type: string
              rationCardNumber:
                type: string
              cardType:
                type: string
            required:
              - customerName
              - rationCardNumber
              - cardType
        quantity:
          type: integer
        amount:
          type: number
        paymentStatus:
          type: string
        paymentMethod:
          type: string
        paymentScreenshotUrl:
          type: string
      required:
        - customerName
        - customerPhone
        - rationCardNumber
        - address
        - state
        - district
        - pincode
        - cardType
        - quantity
        - amount

    UpiConfig:
      type: object
      properties:
        merchantUpiId:
          type: string
      required:
        - merchantUpiId

    UpiSetting:
      type: object
      properties:
        merchantUpiId:
          type: string
        source:
          type: string
          enum: [custom, default]
          description: custom = saved by admin in the settings table, default = MERCHANT_UPI_ID env fallback
      required:
        - merchantUpiId
        - source

    PriceTierPrices:
      type: object
      properties:
        public:
          type: integer
          minimum: 1
          maximum: 10000
        operator:
          type: integer
          minimum: 1
          maximum: 10000
      required:
        - public
        - operator

    PriceGroupPrices:
      type: object
      properties:
        single:
          $ref: "#/components/schemas/PriceTierPrices"
        multi:
          $ref: "#/components/schemas/PriceTierPrices"
      required:
        - single
        - multi

    PricingMatrix:
      type: object
      description: Per-card ₹ prices by group (ration vs special), tier (single vs multi) and audience (public vs operator)
      properties:
        ration:
          $ref: "#/components/schemas/PriceGroupPrices"
        special:
          $ref: "#/components/schemas/PriceGroupPrices"
      required:
        - ration
        - special

    PricingConfig:
      type: object
      properties:
        pricing:
          $ref: "#/components/schemas/PricingMatrix"
      required:
        - pricing

    PricingSetting:
      type: object
      properties:
        pricing:
          $ref: "#/components/schemas/PricingMatrix"
        source:
          type: string
          enum: [custom, default]
          description: custom = saved by admin in the settings table, default = built-in launch prices
      required:
        - pricing
        - source

    PricingSettingUpdate:
      type: object
      properties:
        pricing:
          $ref: "#/components/schemas/PricingMatrix"
      required:
        - pricing

    UpiSettingUpdate:
      type: object
      properties:
        merchantUpiId:
          type: string
          minLength: 3
          maxLength: 120
      required:
        - merchantUpiId

    ProcessingPasswordUpdate:
      type: object
      properties:
        newPassword:
          type: string
          minLength: 8
          maxLength: 100
          description: New employee (processing) login password
      required:
        - newPassword

    ProcessingPasswordUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    SettingsChangeHistoryEntry:
      type: object
      properties:
        id:
          type: integer
        field:
          type: string
          enum: [upi, pricing, processing_password]
          description: Which protected setting changed
        oldValue:
          type: string
          description: Effective value before the save (pricing is a JSON matrix string)
        newValue:
          type: string
          description: Value after the save (pricing is a JSON matrix string)
        changedBy:
          type: string
          description: Admin email from the unlock session that made the change
        changedAt:
          type: string
          format: date-time
      required:
        - id
        - field
        - oldValue
        - newValue
        - changedBy
        - changedAt

    SettingsChangeHistory:
      type: object
      properties:
        changes:
          type: array
          description: Newest first
          items:
            $ref: "#/components/schemas/SettingsChangeHistoryEntry"
      required:
        - changes

    SettingsOtpConfig:
      type: object
      properties:
        partnerEmails:
          type: array
          items:
            type: string
          description: Every partner address that must verify a code
        otpPending:
          type: boolean
          description: Codes were already sent and are still usable (not expired / not locked out)
        cooldownRemainingSeconds:
          type: integer
          description: Seconds until codes may be sent again (0 = allowed now)
      required:
        - partnerEmails
        - otpPending
        - cooldownRemainingSeconds

    SettingsOtpSendResponse:
      type: object
      properties:
        sent:
          type: boolean
        partnerEmails:
          type: array
          items:
            type: string
        expiresInSeconds:
          type: integer
        cooldownSeconds:
          type: integer
      required:
        - sent
        - partnerEmails
        - expiresInSeconds
        - cooldownSeconds

    SettingsOtpVerifyEntry:
      type: object
      properties:
        email:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6
      required:
        - email
        - code

    SettingsOtpVerifyBody:
      type: object
      properties:
        codes:
          type: array
          description: One entry per partner email with the code that partner received
          items:
            $ref: "#/components/schemas/SettingsOtpVerifyEntry"
          minItems: 1
      required:
        - codes

    SettingsOtpVerifyResponse:
      type: object
      properties:
        unlockToken:
          type: string
          description: Send as the x-settings-unlock header on settings endpoints
        expiresInSeconds:
          type: integer
      required:
        - unlockToken
        - expiresInSeconds

    PaymentScreenshotUploadResponse:
      type: object
      properties:
        url:
          type: string
      required:
        - url

    PaymentStatusUpdate:
      type: object
      properties:
        paymentStatus:
          type: string
          enum: ["confirmed", "rejected", "pending"]
      required:
        - paymentStatus

    PaymentStatusUpdateResponse:
      type: object
      properties:
        id:
          type: integer
        paymentStatus:
          type: string
      required:
        - id
        - paymentStatus

    OrderStatusUpdate:
      type: object
      properties:
        status:
          type: string
        trackingNumber:
          type: string
        courierName:
          type: string
        notes:
          type: string

    CustomerInfoUpdate:
      type: object
      description: >-
        Admin correction of the customer's contact & delivery details. All
        fields except postOffice are required — the edit form always submits
        the complete set. Status, payment, and card fields are deliberately
        not part of this schema.
      properties:
        customerName:
          type: string
          minLength: 1
          maxLength: 200
        customerPhone:
          type: string
          pattern: "^[0-9]{10}$"
        address:
          type: string
          minLength: 1
          maxLength: 500
        postOffice:
          type: string
          maxLength: 200
        district:
          type: string
          minLength: 1
          maxLength: 100
        pincode:
          type: string
          pattern: "^[0-9]{6}$"
        state:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - customerName
        - customerPhone
        - address
        - district
        - pincode
        - state

    OrderAssignment:
      type: object
      properties:
        operatorId:
          type: integer
      required:
        - operatorId

    OrderListResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - orders
        - total
        - page
        - limit

    OrderStats:
      type: object
      properties:
        totalOrders:
          type: integer
        pendingOrders:
          type: integer
        processingOrders:
          type: integer
        printedOrders:
          type: integer
        dispatchedOrders:
          type: integer
        deliveredOrders:
          type: integer
        returnedOrders:
          type: integer
        totalRevenue:
          type: number
        todayOrders:
          type: integer
        todayRevenue:
          type: number
      required:
        - totalOrders
        - pendingOrders
        - processingOrders
        - printedOrders
        - dispatchedOrders
        - deliveredOrders
        - returnedOrders
        - totalRevenue
        - todayOrders
        - todayRevenue

    # ── Operator Schemas ───────────────────────────────────────────────────────
    Operator:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        shopName:
          type: string
        address:
          type: string
        state:
          type: string
        district:
          type: string
        pincode:
          type: string
        status:
          type: string
        walletBalance:
          type: number
        totalOrdersHandled:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - phone
        - shopName
        - address
        - state
        - district
        - pincode
        - status
        - walletBalance
        - totalOrdersHandled
        - createdAt

    OperatorInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        password:
          type: string
        shopName:
          type: string
        address:
          type: string
        state:
          type: string
        district:
          type: string
        pincode:
          type: string
      required:
        - name
        - email
        - phone
        - password
        - shopName
        - address
        - state
        - district
        - pincode

    OperatorAuthResponse:
      type: object
      properties:
        operator:
          $ref: "#/components/schemas/Operator"
        token:
          type: string
      required:
        - operator
        - token

    OperatorStats:
      type: object
      properties:
        totalAssigned:
          type: integer
        pending:
          type: integer
        processing:
          type: integer
        printed:
          type: integer
        dispatched:
          type: integer
        delivered:
          type: integer
        walletBalance:
          type: number
      required:
        - totalAssigned
        - pending
        - processing
        - printed
        - dispatched
        - delivered
        - walletBalance

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AdminAuthResponse:
      type: object
      description: >-
        Staff session. `role` is `admin` (partners) or `processing`
        (employee panel). `token` is only present in the login response.
      properties:
        role:
          type: string
        email:
          type: string
        token:
          type: string
      required:
        - role
        - email

    UpdateOperatorStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [active, pending, suspended]
      required:
        - status

    OperatorStatusResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        status:
          type: string
      required:
        - id
        - name
        - email
        - status

    PaymentVerification:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        orderNumber:
          type: string
        action:
          type: string
        adminEmail:
          type: string
        screenshotUrl:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        verifiedAt:
          type: string
      required:
        - id
        - orderId
        - orderNumber
        - action
        - adminEmail
        - verifiedAt

    # ── Review Schemas ─────────────────────────────────────────────────────────
    Review:
      type: object
      properties:
        id:
          type: integer
        orderNumber:
          type: string
        customerName:
          type: string
        district:
          type: string
        cardType:
          type: string
        rating:
          type: integer
        quote:
          type: string
        photoUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - orderNumber
        - customerName
        - district
        - cardType
        - rating
        - quote
        - status
        - createdAt
        - updatedAt

    ReviewInput:
      type: object
      properties:
        orderNumber:
          type: string
        customerName:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        quote:
          type: string
        photoUrl:
          type: string
      required:
        - orderNumber
        - customerName
        - rating
        - quote

    ReviewStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [approved, rejected]
      required:
        - status

    PaymentVerificationListResponse:
      type: object
      properties:
        verifications:
          type: array
          items:
            $ref: "#/components/schemas/PaymentVerification"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - verifications
        - total
        - page
        - limit
