    <script type="application/ld+json">

          "@type": "Question",
          "name": "What is PVC Card Portal?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PVC Card Portal is a private, non-government online service that prints your existing West Bengal e-Ration Card onto a durable, wallet-size PVC card and delivers it to your doorstep. It is not affiliated with the Department of Food & Supplies, Government of West Bengal."
          }

        {
          "@type": "Question",
          "name": "Is it legal to print a government ration card on PVC?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Printing your existing, officially issued e-Ration Card on PVC for personal convenience is permitted. We do not modify, edit, or tamper with any government-issued content — we only reproduce your approved card onto a durable PVC format."
          }
        },
        {
          "@type": "Question",
          "name": "What is the size of the PVC ration card?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The PVC card is printed in the standard CR80 credit card size: 85.6mm × 54mm (3.375 inches × 2.125 inches) with a thickness of approximately 760 microns. It fits perfectly in any wallet slot alongside your Aadhaar, PAN card, or driving licence."
          }
        },
        {
          "@type": "Question",
          "name": "Which ration card types do you support — AAY, PHH, SPHH, RKSY?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We support PVC printing for all West Bengal ration card categories: AAY (Antyodaya Anna Yojana), PHH (Priority Household), SPHH (Special Priority Household), RKSY-I (Rajya Khadya Suraksha Yojana Category I), and RKSY-II (Rajya Khadya Suraksha Yojana Category II). Simply upload your e-Ration Card PDF and we will print whichever type you have."
          }
        },
        {
          "@type": "Question",
          "name": "Which districts in West Bengal do you deliver to?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We deliver to all 23 districts of West Bengal: Kolkata, Howrah, North 24 Parganas, South 24 Parganas, Murshidabad, Purba Bardhaman, Paschim Bardhaman, Nadia, Hooghly, Paschim Medinipur, Purba Medinipur, Bankura, Purulia, Birbhum, Malda, Uttar Dinajpur, Dakshin Dinajpur, Jalpaiguri, Darjeeling, Cooch Behar, Alipurduar, Jhargram, and Kalimpong."
          }
        },
        {
          "@type": "Question",
          "name": "How is this different from the government ration card service?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Government of West Bengal issues free digital e-Ration Cards (PDF format) through food.wb.gov.in. Our service is separate — we print your already-approved e-Ration Card onto a durable PVC card for a fee of Rs 70. We do not issue, create, or modify any government documents. Official services are free at food.wb.gov.in."
          }
        },
        {
          "@type": "Question",
          "name": "Can I order PVC cards for all family members?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. You can order a PVC card for every member listed on your ration card. For a single card the price is Rs 70. For 2 or more cards in the same family order, the price is Rs 50 per card."
          }
        },
        {
          "@type": "Question",
          "name": "How much does a PVC ration card cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A single PVC ration card costs Rs 70 (inclusive of printing and delivery). For 2 or more cards in the same family, the price is Rs 50 per card."
