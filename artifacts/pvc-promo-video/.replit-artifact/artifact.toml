kind = "video"
previewPath = "/pvc-promo-video/"
title = "PVC Card Portal — Promo Video"
version = "1.0.0"
id = "artifacts/pvc-promo-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pvc-promo-video/" ]
localPort = 25502

[services.development]
run = "pnpm --filter @workspace/pvc-promo-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pvc-promo-video", "run", "build" ]
publicDir = "artifacts/pvc-promo-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25502"
BASE_PATH = "/pvc-promo-video/"
